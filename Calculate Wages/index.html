<!DOCTYPE html>
<html>
    <head>
        <title>Calc Wages</title>
        <script src="calc.js" defer></script>
    </head>
    <body>
        <p>Please give me data: </p> <br>
        <p>Normal Hours per day</p>
        <input type="number" name="nHours" id="nHours">
        <p>Hourly Wage</p>
        <input type="number" name="hourlyWage" id="hourlyWage">
        <p>Overtime Rate</p>
        <input type="number" name="ot" id="ot">
        <p>Hours Worked</p>
        <input type="number" name="hoursWorked" id="hoursWorked">
        <button id="calc">Calculate!</button>
        <p>You Earned:</p>
        <h1 id="dailyWage"></h1>
    </body>
</html>
